<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Momen Marketing Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAFAF8;--bg2:#F4F1EC;--sidebar:#1C1811;--sidebar-hover:#2A2318;
  --card:#FFFFFF;--border:#E8E2D8;--border-dark:#D4CCB8;
  --gold:#C9A84C;--gold-light:#E8C878;--gold-dark:#A07830;--gold-pale:#FBF5E8;--gold-pale2:#F5EDD5;
  --ig-pink:#E1306C;--ig-purple:#833AB4;--ig-orange:#F77737;
  --tt-red:#FE2C55;--tt-cyan:#25F4EE;
  --text-dark:#1C1811;--text-body:#4A4035;--text-muted:#8A7E6A;--text-dim:#B8AC98;--text-white:#FFFFFF;
  --green:#22C55E;--red:#EF4444;--blue:#3B82F6;--amber:#F59E0B;
  --radius:16px;--radius-sm:10px;--radius-xs:6px;
  --shadow:0 2px 12px rgba(28,24,17,.07);--shadow-md:0 4px 24px rgba(28,24,17,.1);--shadow-lg:0 8px 40px rgba(28,24,17,.13);
}
html,body,#root{height:100%;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text-dark);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-dark);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--gold-dark)}

/* LAYOUT */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--sidebar);display:flex;flex-direction:column;overflow-y:auto}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg)}

/* SIDEBAR */
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:12px}
.sb-logo-img{width:40px;height:40px;border-radius:10px;background:var(--gold-pale);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.sb-logo-img img{width:100%;height:100%;object-fit:contain;padding:5px}
.sb-brand{font-size:17px;font-weight:800;color:var(--gold);letter-spacing:2px;line-height:1}
.sb-tagline{font-size:9px;color:rgba(255,255,255,.3);margin-top:2px;letter-spacing:.3px}
.sb-section{padding:16px 18px 5px;font-size:9px;font-weight:700;color:rgba(255,255,255,.2);letter-spacing:1.5px;text-transform:uppercase}
.sb-nav{padding:0 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:rgba(255,255,255,.45);cursor:pointer;transition:all .18s;margin-bottom:2px;user-select:none}
.nav-item:hover{background:var(--sidebar-hover);color:rgba(255,255,255,.8)}
.nav-item.active{background:rgba(201,168,76,.15);color:var(--gold);font-weight:700}
.nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sb-footer{padding:14px 18px 20px;margin-top:auto;border-top:1px solid rgba(255,255,255,.06);font-size:9px;color:rgba(255,255,255,.2);line-height:1.7}
.sb-footer span{color:rgba(201,168,76,.6);font-weight:600}

/* TOPBAR */
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:var(--shadow);position:sticky;top:0;z-index:5}
.page-title{font-size:20px;font-weight:800;color:var(--text-dark);line-height:1}
.page-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:10px}
.date-pill{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 14px;font-size:12px;font-weight:600;color:var(--text-body)}
.live-pill{display:flex;align-items:center;gap:6px;background:var(--gold-pale);border:1px solid var(--gold-pale2);border-radius:var(--radius-sm);padding:7px 14px;font-size:12px;font-weight:700;color:var(--gold-dark)}

/* PERIOD SELECTOR */
.period-sel{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.period-btn{padding:7px 14px;font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;border:none;background:none;font-family:inherit;transition:all .15s}
.period-btn.active{background:var(--gold);color:#fff}
.period-btn:hover:not(.active){background:var(--border);color:var(--text-dark)}

/* PAGE BODY */
.page-body{padding:22px 24px;flex:1}

/* GRIDS */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.mb14{margin-bottom:14px}.mb18{margin-bottom:18px}.mb22{margin-bottom:22px}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow-md)}
.card-sm{padding:12px 14px}
.card-title{font-size:14px;font-weight:700;color:var(--text-dark)}
.card-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

/* SECTION LABEL */
.sec-label{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-label-text{font-size:13px;font-weight:700;color:var(--text-dark);white-space:nowrap}
.sec-label-line{flex:1;height:1px;background:var(--border)}
.sec-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--gold-pale2);color:var(--gold-dark);white-space:nowrap}

/* METRIC CARD */
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);transition:all .2s;position:relative;overflow:hidden}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--acc,var(--gold));opacity:0;transition:opacity .2s}
.metric-card:hover::before{opacity:1}
.metric-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.metric-icon{width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:10px}
.metric-label{font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.3px;margin-bottom:5px}
.metric-value{font-size:24px;font-weight:800;color:var(--text-dark);line-height:1;margin-bottom:5px}
.metric-trend{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600}
.t-up{color:var(--green)}.t-down{color:var(--red)}.t-neu{color:var(--text-muted)}
.trend-vs{font-size:10px;color:var(--text-dim);font-weight:400}

/* PLATFORM TAG */
.tag-ig{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(225,48,108,.1);color:var(--ig-pink);border:1px solid rgba(225,48,108,.2)}
.tag-tt{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(254,44,85,.08);color:var(--tt-red);border:1px solid rgba(254,44,85,.15)}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge-green{background:rgba(34,197,94,.1);color:var(--green)}
.badge-red{background:rgba(239,68,68,.1);color:var(--red)}
.badge-amber{background:rgba(245,158,11,.1);color:var(--amber)}
.badge-blue{background:rgba(59,130,246,.1);color:var(--blue)}
.badge-gold{background:var(--gold-pale2);color:var(--gold-dark)}

/* ACCOUNT CARD */
.account-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s}
.account-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.account-card.selected{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.15),var(--shadow)}
.acc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.acc-stat-val{font-size:16px;font-weight:800;color:var(--text-dark);text-align:center}
.acc-stat-label{font-size:9px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.3px;text-align:center}

/* PROGRESS BAR */
.prog-bg{background:var(--bg2);border-radius:10px;height:6px;overflow:hidden;margin-top:5px}
.prog-fill{height:100%;border-radius:10px;transition:width .6s ease}

/* TABLE */
.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;padding:0 10px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.data-table td{padding:10px 10px;font-size:12px;color:var(--text-body);border-bottom:1px solid var(--bg2);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--bg)}

/* TABS */
.tab-row{display:flex;gap:3px;background:var(--bg2);border-radius:var(--radius-sm);padding:4px;border:1px solid var(--border)}
.tab-btn{flex:1;padding:8px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .18s;border:none;background:none;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px}
.tab-btn:hover:not(.active){color:var(--text-dark);background:rgba(0,0,0,.03)}
.tab-btn.active{background:white;color:var(--text-dark);box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:700}

/* POST ROW */
.post-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg2)}
.post-item:last-child{border-bottom:none}
.post-thumb{width:50px;height:50px;border-radius:var(--radius-xs);background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.post-info{flex:1;min-width:0}
.post-caption{font-size:12px;font-weight:600;color:var(--text-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.post-meta{display:flex;gap:8px;flex-wrap:wrap}
.post-meta-item{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text-muted)}

/* DONUT */
.donut-wrap{position:relative;margin:0 auto}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.donut-cval{font-size:20px;font-weight:800;color:var(--text-dark);line-height:1}
.donut-csub{font-size:10px;color:var(--text-muted);margin-top:1px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal-box{background:var(--card);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow-lg);max-width:540px;width:90%;max-height:80vh;overflow-y:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:18px;font-weight:800;color:var(--text-dark)}
.modal-close{width:30px;height:30px;border-radius:50%;background:var(--bg2);border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-family:inherit}
.modal-close:hover{background:var(--border)}

/* FORMS */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--text-body);margin-bottom:5px}
.form-input,.form-select{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-xs);padding:9px 12px;font-size:13px;font-weight:500;color:var(--text-dark);font-family:inherit;outline:none;transition:border-color .15s}
.form-input:focus,.form-select:focus{border-color:var(--gold)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

/* BUTTONS */
.btn{padding:9px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.btn-gold{background:var(--gold);color:white}.btn-gold:hover{background:var(--gold-dark)}
.btn-dark{background:var(--text-dark);color:white}.btn-dark:hover{background:#2e2820}
.btn-ghost{background:var(--bg2);color:var(--text-body);border:1px solid var(--border)}.btn-ghost:hover{background:var(--border)}

/* CHART CONTAINERS */
.chart-h180{height:180px;position:relative}
.chart-h200{height:200px;position:relative}
.chart-h220{height:220px;position:relative}

/* LEGEND */
.legend-list{display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.legend-left{display:flex;align-items:center;gap:7px}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-body{animation:fadeIn .25s ease}

/* RESPONSIVE STYLES */
@media (max-width: 768px) {
  .app {
    position: relative;
    overflow: hidden;
  }
  .sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 200;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .sidebar.mobile-open {
    transform: translateX(0);
  }
  
  .mobile-toggle {
    display: block !important;
  }
  
  .g4, .g3, .g2, .g21 {
    grid-template-columns: 1fr !important;
    gap: 12px;
  }
  
  .topbar {
    padding: 10px 16px;
  }
  .page-body {
    padding: 16px;
  }
  .topbar-right {
    gap: 6px;
  }
  .date-pill, .live-pill {
    padding: 5px 10px;
    font-size: 11px;
  }
}

@media (max-width: 500px) {
  .modal-box {
    padding: 16px !important;
    width: 95% !important;
  }
  /* Stacking the presets in the date range modal */
  .modal-box div[style*="display: flex; gap: 18px"], 
  .modal-box div[style*="display:flex; gap:18px"] {
    flex-direction: column !important;
    gap: 12px !important;
  }
  .modal-box div[style*="width: 130px"] {
    width: 100% !important;
    flex-direction: row !important;
    flex-wrap: wrap !important;
    border-right: none !important;
    border-bottom: 1px solid var(--bg2) !important;
    padding-right: 0 !important;
    padding-bottom: 10px !important;
  }
  .modal-box button[style*="text-align: left"],
  .modal-box button[style*="text-align:left"] {
    text-align: center !important;
    flex: 1 1 auto !important;
    white-space: nowrap !important;
  }
}
</style>
</head>

/* ═══════════════════════════════════════
   CHART COMPONENTS
═══════════════════════════════════════ */
function LineChart({data,labels,color='#C9A84C',height=180,label=''}){
  const ref=useRef();const ch=useRef();
  useEffect(()=>{if(!ref.current)return;if(ch.current)ch.current.destroy();
    ch.current=new Chart(ref.current,{type:'line',data:{labels,datasets:[{label,data,borderColor:color,borderWidth:2.5,pointRadius:4,pointBackgroundColor:color,pointBorderColor:'#fff',pointBorderWidth:2,tension:.4,fill:{target:'origin',above:color+'18'}}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#1C1811',titleColor:'#E8C878',bodyColor:'#E0D8C8',padding:10,cornerRadius:8,callbacks:{label:c=>` ${D.fmt(c.parsed.y)}`}}},scales:{x:{grid:{display:false},border:{display:false},ticks:{color:'#B8AC98',font:{size:10}}},y:{grid:{color:'rgba(0,0,0,.05)'},border:{display:false},ticks:{color:'#B8AC98',font:{size:10},callback:v=>D.fmt(v)}}},interaction:{mode:'index',intersect:false}}});
    return()=>{if(ch.current)ch.current.destroy()};
  },[]);
  return <div style={{height,position:'relative'}}><canvas ref={ref}/></div>;
}

function MultiLineChart({datasets,labels,height=220}){
  const ref=useRef();const ch=useRef();
  useEffect(()=>{if(!ref.current)return;if(ch.current)ch.current.destroy();
    ch.current=new Chart(ref.current,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'top',labels:{color:'#4A4035',font:{size:11,weight:'600'},usePointStyle:true,padding:14}},tooltip:{backgroundColor:'#1C1811',titleColor:'#E8C878',bodyColor:'#E0D8C8',padding:10,cornerRadius:8,callbacks:{label:c=>` ${c.dataset.label}: ${D.fmt(c.parsed.y)}`}}},scales:{x:{grid:{display:false},border:{display:false},ticks:{color:'#B8AC98',font:{size:10}}},y:{grid:{color:'rgba(0,0,0,.05)'},border:{display:false},ticks:{color:'#B8AC98',font:{size:10},callback:v=>D.fmt(v)}}},interaction:{mode:'index',intersect:false}}});
    return()=>{if(ch.current)ch.current.destroy()};
  },[]);
  return <div style={{height,position:'relative'}}><canvas ref={ref}/></div>;
}

function BarChart({data,labels,colors,height=180,horizontal=false}){
  const ref=useRef();const ch=useRef();
  const palette=['#C9A84C','#A07830','#8B6914','#6B4F10','#4a3a10','#E8C878'];
  useEffect(()=>{if(!ref.current)return;if(ch.current)ch.current.destroy();
    ch.current=new Chart(ref.current,{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors||data.map((_,i)=>palette[i%palette.length]),borderRadius:6,borderSkipped:false}]},
    options:{indexAxis:horizontal?'y':'x',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#1C1811',titleColor:'#E8C878',bodyColor:'#E0D8C8',padding:10,cornerRadius:8,callbacks:{label:c=>` ${c.parsed[horizontal?'x':'y'].toLocaleString('id-ID')}`}}},scales:{x:{grid:{display:horizontal},border:{display:false},ticks:{color:'#B8AC98',font:{size:10}}},y:{grid:{color:'rgba(0,0,0,.04)',display:!horizontal},border:{display:false},ticks:{color:'#B8AC98',font:{size:10},callback:v=>D.fmt(v)}}}}});
    return()=>{if(ch.current)ch.current.destroy()};
  },[]);
  return <div style={{height,position:'relative'}}><canvas ref={ref}/></div>;
}

function DonutChart({segments,cVal,cLabel,size=140}){
  const ref=useRef();const ch=useRef();
  useEffect(()=>{if(!ref.current)return;if(ch.current)ch.current.destroy();
    ch.current=new Chart(ref.current,{type:'doughnut',data:{labels:segments.map(s=>s.label),datasets:[{data:segments.map(s=>s.value),backgroundColor:segments.map(s=>s.color),borderWidth:2,borderColor:'#FFFFFF',hoverOffset:5}]},
    options:{cutout:'72%',responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},tooltip:{backgroundColor:'#1C1811',titleColor:'#E8C878',bodyColor:'#E0D8C8',padding:10,cornerRadius:8,callbacks:{label:c=>` ${c.label}: ${c.parsed}%`}}}}});
    return()=>{if(ch.current)ch.current.destroy()};
  },[]);
  return(
    <div className="donut-wrap" style={{width:size,height:size}}>
      <canvas ref={ref}/>
      {cVal&&<div className="donut-center"><div className="donut-cval">{cVal}</div>{cLabel&&<div className="donut-csub">{cLabel}</div>}</div>}
    </div>
  );
}

/* ═══════════════════════════════════════
   SMALL COMPONENTS
═══════════════════════════════════════ */
function PTag({platform}){return platform==='instagram'?<span className="tag-ig">📷 Instagram</span>:<span className="tag-tt">🎵 TikTok</span>}

function MetricCard({icon,label,value,trend,trendLabel,acc}){
  const isUp=trend>0,isN=trend===0;
  return(
    <div className="metric-card" style={{'--acc':acc||'var(--gold)'}}>
      <div className="metric-icon" style={{background:(acc||'#C9A84C')+'18',color:acc||'var(--gold-dark)'}}>{icon}</div>
      <div className="metric-label">{label}</div>
      <div className="metric-value">{value}</div>
      {trend!==undefined&&<div className={`metric-trend ${isN?'t-neu':isUp?'t-up':'t-down'}`}>
        <span>{isN?'→':isUp?'↑':'↓'}</span>
        <span>{Math.abs(trend).toFixed(1)}%</span>
        {trendLabel&&<span className="trend-vs">{trendLabel}</span>}
      </div>}
    </div>
  );
}

function SectionLabel({children,badge}){
  return(
    <div className="sec-label">
      <span className="sec-label-text">{children}</span>
      <div className="sec-label-line"/>
      {badge&&<span className="sec-badge">{badge}</span>}
    </div>
  );
}

function PeriodSel({value,onChange}){
  return(
    <div className="period-sel">
      {[['7d','7 Hari'],['30d','30 Hari'],['90d','90 Hari']].map(([v,l])=>(
        <button key={v} className={`period-btn${value===v?' active':''}`} onClick={()=>onChange(v)}>{l}</button>
      ))}
    </div>
  );
}

function Modal({open,onClose,title,children}){
  if(!open)return null;
  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box">
        <div className="modal-head">
          <div className="modal-title">{title}</div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function ProgRow({label,value,max,color}){
  const pct=Math.round(value/max*100);
  return(
    <div style={{marginBottom:8}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
        <span style={{fontSize:12,color:'var(--text-body)',fontWeight:500}}>{label}</span>

      </div>
      <div className="prog-bg"><div className="prog-fill" style={{width:pct+'%',background:color||'var(--gold)'}}/></div>
    </div>
  );
}

        <div className="card">
          <div className="card-title" style={{marginBottom:14}}>📍 Kota Terbanyak</div>

}

function OverviewPage({period}){
  const accs=D.getAllAccounts();
  const igA=accs.filter(a=>a.platform==='instagram');
  const ttA=accs.filter(a=>a.platform==='tiktok');

  const totals=useMemo(()=>{
    let f=0,r=0,pv=0,er=0,n=0;
    accs.forEach(a=>{f+=a.followers;const m=D.getMetrics(a.id,period);if(m){r+=m.current.reach;pv+=m.current.profileVisits;er+=m.current.engagementRate;n++}});
    return {followers:f,reach:r,profileVisits:pv,engagementRate:n>0?er/n:0};
  },[period]);

  const totalFollowers=totals.followers;

  return(
    <div className="page-body">
      <SectionLabel badge="Total Momen">Ringkasan Semua Akun</SectionLabel>
      
      {/* Metrics Row */}
      <div className="g4 mb18">
        <MetricCard icon="👥" label="Total Followers" value={D.fmt(totalFollowers)} acc="#C9A84C"/>
        <MetricCard icon="👁️" label="Total Reach" value={D.fmt(totals.reach)} trend={14.2} trendLabel="vs periode lalu" acc="#833AB4"/>
        <MetricCard icon="🔍" label="Total Profil Visit" value={D.fmt(totals.profileVisits)} trend={18.8} trendLabel="vs periode lalu" acc="#3B82F6"/>
        <MetricCard icon="💫" label="Rata-rata Eng. Rate" value={totals.engagementRate.toFixed(1)+'%'} trend={0.8} trendLabel="vs periode lalu" acc="#22C55E"/>
      </div>

      {/* Instagram Overview Section */}
      <SectionLabel badge={igA.length+' akun'}>Instagram</SectionLabel>
      <div className="g3 mb18">
        {igA.map(a=><AccountCard key={a.id} acc={a} metrics={D.getMetrics(a.id,period)} period={period} selected={false} onClick={()=>{}}/>)}
      </div>

      {/* TikTok Overview Section */}
      <SectionLabel badge={ttA.length+' akun'}>TikTok</SectionLabel>
      <div className="g2 mb18">
        {ttA.map(a=><AccountCard key={a.id} acc={a} metrics={D.getMetrics(a.id,period)} period={period} selected={false} onClick={()=>{}}/>)}
      </div>

      {/* Combined Followers Growth Chart */}
      <div className="card mb18">
        <div className="card-title">📈 Pertumbuhan Followers — Semua Akun</div>
        <div className="card-sub" style={{marginBottom:14}}>Jan - Jul 2026</div>
        <MultiLineChart
          key={period}
          labels={D.compData.months}
          datasets={accs.map(a=>({
            label: a.handle + (a.platform==='instagram'?' (IG)':' (TT)'),
            data: D.compData.accounts[a.id],
            borderColor: a.platform==='instagram'?'#E1306C':'#FE2C55',
            backgroundColor: 'transparent',
            borderWidth: 2,
            pointRadius: 3,
            tension: 0.3
          }))}
        />
      </div>

      <div className="g2">
        <div className="card">
          <div className="card-title" style={{marginBottom:14}}>📊 Proporsi Pengikut Platform</div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:22}}>
            <DonutChart size={130} segments={[{label:'Instagram',value:igA.reduce((s,a)=>s+a.followers,0),color:'#E1306C'},{label:'TikTok',value:ttA.reduce((s,a)=>s+a.followers,0),color:'#FE2C55'}]} cVal={D.fmt(totalFollowers)} cLabel="Total"/>
            <div className="legend-list" style={{flex:1}}>
              {[{label:'📷 Instagram',color:'#E1306C',value:igA.reduce((s,a)=>s+a.followers,0)},{label:'🎵 TikTok',color:'#FE2C55',value:ttA.reduce((s,a)=>s+a.followers,0)}].map(x=>(
                <div key={x.label} className="legend-item">
                  <div className="legend-left"><div className="legend-dot" style={{background:x.color}}/><span style={{fontSize:13}}>{x.label}</span></div>
                  <div><strong style={{fontSize:14}}>{D.fmt(x.value)}</strong><span style={{fontSize:11,color:'var(--text-dim)',marginLeft:6}}>{Math.round(x.value/totalFollowers*100)}%</span></div>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-title" style={{marginBottom:4}}>🏆 Ranking Engagement Rate</div>
          <div className="card-sub" style={{marginBottom:14}}>Berdasarkan ER {period==='7d'?'7':period==='30d'?'30':'90'} hari terakhir</div>
          {accs.map(a=>({a,er:D.getMetrics(a.id,period)?.current.engagementRate||0}))
            .sort((x,y)=>y.er-x.er)
            .map(({a,er},i)=>(
            <div key={a.id} style={{display:'flex',alignItems:'center',gap:10,marginBottom:11}}>
              <div style={{width:22,height:22,borderRadius:5,background:i===0?'var(--gold-pale2)':'var(--bg2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:i===0?'var(--gold-dark)':'var(--text-dim)',flexShrink:0}}>#{i+1}</div>
              <div style={{flex:1}}>
                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                  <span style={{fontSize:12,fontWeight:700}}>{a.handle}</span>
                  <PTag platform={a.platform}/>
                </div>
                <div className="prog-bg" style={{height:5}}><div className="prog-fill" style={{width:(er/12*100)+'%',background:a.platform==='instagram'?'#E1306C':'#FE2C55'}}/></div>
              </div>
              <div style={{fontSize:14,fontWeight:800,minWidth:44,textAlign:'right'}}>{er.toFixed(1)}%</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ContentPage({period,range}){
  const [ideas,setIdeas]=useState(D.initContent);
  const [modal,setModal]=useState(false);
  
  // Advanced filters state
  const [searchTitle,setSearchTitle]=useState('');
  const [filterPlatform,setFilterPlatform]=useState('semua');
  const [filterType,setFilterType]=useState('semua');
  const [filterPriority,setFilterPriority]=useState('semua');
  const [filterStatus,setFilterStatus]=useState('semua');

  const [form,setForm]=useState({title:'',platform:'instagram',type:'Post',priority:'Sedang',dueDate:'',status:'Direncanakan'});

  const filtered = useMemo(() => {
    return ideas.filter(item => {
      // 1. Filter by Title Search
      if (searchTitle && !item.title.toLowerCase().includes(searchTitle.toLowerCase())) return false;
      
      // 2. Filter by Platform
      if (filterPlatform !== 'semua' && item.platform !== filterPlatform) return false;
      
      // 3. Filter by Tipe
      if (filterType !== 'semua' && item.type !== filterType) return false;
      
      // 4. Filter by Prioritas
      if (filterPriority !== 'semua' && item.priority !== filterPriority) return false;
      
      // 5. Filter by Status
      if (filterStatus !== 'semua' && item.status !== filterStatus) return false;
      
      // 6. Filter by Global Date Range (from topbar)
      if (item.dueDate) {
        const itemDate = new Date(item.dueDate);
        if (range && range.start) {
          const start = new Date(range.start);
          if (itemDate < start) return false;
        }
        if (range && range.end) {
          const end = new Date(range.end);
          end.setHours(23, 59, 59, 999);
          if (itemDate > end) return false;
        }
      }
      return true;
    });
  }, [ideas, searchTitle, filterPlatform, filterType, filterPriority, filterStatus, range]);

  const stColor={'Direncanakan':'#3B82F6','Draft':'#F59E0B','Siap Publish':'#22C55E','Sudah Tayang':'#8B5CF6'};
  const prColor={'Tinggi':'#EF4444','Sedang':'#F59E0B','Rendah':'#22C55E'};

  function add(){
    if(!form.title.trim())return;
    setIdeas(p=>[...p,{...form,id:Date.now()}]);
    setModal(false);
    setForm({title:'',platform:'instagram',type:'Post',priority:'Sedang',dueDate:'',status:'Direncanakan'});
  }

  function del(id){
    setIdeas(p=>p.filter(i=>i.id!==id));
  }

  function upd(id,status){
    setIdeas(p=>p.map(i=>i.id===id?{...i,status}:i));
  }

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  return(
    <div className="page-body">
      {/* Search and Advanced Filter Panel */}
      <div className="card mb18" style={{padding: '16px'}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', borderBottom:'1px solid var(--bg2)', paddingBottom:'10px', marginBottom:'12px'}}>
          <div style={{fontWeight:800, fontSize:14, color:'var(--text-dark)'}}>🔍 Filter & Pencarian Lanjutan</div>
          <button 
            className="btn btn-ghost" 
            style={{padding:'4px 8px', fontSize:11, background:'none', border:'none', color:'var(--text-muted)'}}
            onClick={() => {
              setSearchTitle('');
              setFilterPlatform('semua');
              setFilterType('semua');
              setFilterPriority('semua');
              setFilterStatus('semua');
            }}
          >
            🔄 Reset Filter
          </button>
        </div>
        
        {/* Row 1: Categorical Filters */}
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))', gap:12}}>
          <div className="form-group" style={{marginBottom:0}}>
            <label className="form-label" style={{fontSize:11, marginBottom:4}}>Cari Judul Konten</label>
            <input 
              className="form-input" 
              style={{padding:'6px 10px', fontSize:12}}
              placeholder="Ketik judul..." 
              value={searchTitle} 
              onChange={e => setSearchTitle(e.target.value)}
            />
          </div>
          <div className="form-group" style={{marginBottom:0}}>
            <label className="form-label" style={{fontSize:11, marginBottom:4}}>Platform</label>
            <select 
              className="form-select" 
              style={{padding:'6px 10px', fontSize:12}}
              value={filterPlatform} 
              onChange={e => setFilterPlatform(e.target.value)}
            >
              <option value="semua">Semua Platform</option>
              <option value="instagram">Instagram</option>
              <option value="tiktok">TikTok</option>
            </select>
          </div>
          <div className="form-group" style={{marginBottom:0}}>
            <label className="form-label" style={{fontSize:11, marginBottom:4}}>Tipe Konten</label>
            <select 
              className="form-select" 
              style={{padding:'6px 10px', fontSize:12}}
              value={filterType} 
              onChange={e => setFilterType(e.target.value)}
            >
              <option value="semua">Semua Tipe</option>
              {['Post','Reels','Carousel','Story','Video','Duet','Live'].map(t => (
                <option key={t} value={t}>{t}</option>
              ))}
            </select>
          </div>
          <div className="form-group" style={{marginBottom:0}}>
            <label className="form-label" style={{fontSize:11, marginBottom:4}}>Prioritas</label>
            <select 
              className="form-select" 
              style={{padding:'6px 10px', fontSize:12}}
              value={filterPriority} 
              onChange={e => setFilterPriority(e.target.value)}
            >
              <option value="semua">Semua Prioritas</option>
              <option value="Tinggi">Tinggi</option>
              <option value="Sedang">Sedang</option>
              <option value="Rendah">Rendah</option>
            </select>
          </div>
          <div className="form-group" style={{marginBottom:0}}>
            <label className="form-label" style={{fontSize:11, marginBottom:4}}>Status</label>
            <select 
              className="form-select" 
              style={{padding:'6px 10px', fontSize:12}}
              value={filterStatus} 
              onChange={e => setFilterStatus(e.target.value)}
            >
              <option value="semua">Semua Status</option>
              {['Direncanakan','Draft','Siap Publish','Sudah Tayang'].map(s => (
                <option key={s} value={s}>{s}</option>
              ))}
            </select>
          </div>
        </div>
      </div>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <div style={{fontSize:11, color:'var(--text-muted)'}}>
          Menampilkan <strong>{filtered.length}</strong> dari <strong>{ideas.length}</strong> ide konten
        </div>
        <button className="btn btn-gold" onClick={()=>setModal(true)}>+ Tambah Ide</button>
      </div>

      <div className="g4 mb18">
        {['Direncanakan','Draft','Siap Publish','Sudah Tayang'].map(s=>(
          <div className="card card-sm" key={s} style={{borderTop:`3px solid ${stColor[s]}`}}>
            <div style={{fontSize:22,fontWeight:800}}>{filtered.filter(i=>i.status===s).length}</div>
            <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>{s}</div>
          </div>
        ))}
      </div>

      <SectionLabel badge={filtered.length+' konten'}>Daftar Ide Konten</SectionLabel>
      <div className="card">
        {filtered.length===0?<div style={{textAlign:'center',padding:'30px 0',color:'var(--text-dim)'}}>📝 Belum ada ide konten yang sesuai filter</div>:(
          <table className="data-table">
            <thead><tr><th>Judul Konten</th><th>Platform</th><th>Tipe</th><th>Prioritas</th><th>Deadline</th><th>Status</th><th>Aksi</th></tr></thead>
            <tbody>
              {filtered.map(idea=>(
                <tr key={idea.id}>
                  <td style={{fontWeight:600}}>{idea.title}</td>
                  <td><PTag platform={idea.platform}/></td>
                  <td><span className="badge badge-blue">{idea.type}</span></td>
                  <td><span style={{fontSize:11,fontWeight:700,color:prColor[idea.priority]}}>● {idea.priority}</span></td>
                  <td style={{color:'var(--text-muted)', fontWeight:600}}>{formatDate(idea.dueDate)}</td>
                  <td>
                    <select className="form-select" style={{width:'auto',borderColor:stColor[idea.status]+'40',color:stColor[idea.status],padding:'5px 8px'}} value={idea.status} onChange={e=>upd(idea.id,e.target.value)}>
                      {['Direncanakan','Draft','Siap Publish','Sudah Tayang'].map(s=><option key={s}>{s}</option>)}
                    </select>
                  </td>
                  <td><button onClick={()=>del(idea.id)} style={{background:'none',border:'none',cursor:'pointer',fontSize:16,padding:'2px 6px'}}>🗑️</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      <Modal open={modal} onClose={()=>setModal(false)} title="➕ Tambah Ide Konten">
        <div className="form-group">
          <label className="form-label">Judul Konten *</label>
          <input className="form-input" placeholder="cth: Tutorial GRWM Batik Momen" value={form.title} onChange={e=>setForm(p=>({...p,title:e.target.value}))}/>
        </div>
        <div className="form-row">
          <div className="form-group"><label className="form-label">Platform</label>
            <select className="form-select" value={form.platform} onChange={e=>setForm(p=>({...p,platform:e.target.value}))}>
              <option value="instagram">📷 Instagram</option><option value="tiktok">🎵 TikTok</option>
            </select>
          </div>
          <div className="form-group"><label className="form-label">Tipe</label>
            <select className="form-select" value={form.type} onChange={e=>setForm(p=>({...p,type:e.target.value}))}>
              {['Post','Reels','Carousel','Story','Video','Duet','Live'].map(t=><option key={t}>{t}</option>)}
            </select>
          </div>
        </div>
        <div className="form-row">
          <div className="form-group"><label className="form-label">Prioritas</label>
            <select className="form-select" value={form.priority} onChange={e=>setForm(p=>({...p,priority:e.target.value}))}>
              {['Tinggi','Sedang','Rendah'].map(t=><option key={t}>{t}</option>)}
            </select>
          </div>
          <div className="form-group"><label className="form-label">Deadline</label>

}

function Calendar({ month, year, selectedStart, selectedEnd, onDayClick }) {
  const firstDay = new Date(year, month, 1).getDay();
  const totalDays = new Date(year, month + 1, 0).getDate();
  const prevMonthTotalDays = new Date(year, month, 0).getDate();
  
  const cells = [];
  
  // Padding from previous month
  for (let i = firstDay - 1; i >= 0; i--) {
    cells.push({
      date: new Date(year, month - 1, prevMonthTotalDays - i),
      isCurrentMonth: false
    });
  }
  
  // Current month days
  for (let i = 1; i <= totalDays; i++) {
    cells.push({
      date: new Date(year, month, i),
      isCurrentMonth: true
    });
  }
  
  // Padding for next month to fill grid
  const remaining = 42 - cells.length;
  for (let i = 1; i <= remaining; i++) {
    cells.push({
      date: new Date(year, month + 1, i),
      isCurrentMonth: false
    });
  }

  const weekdays = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

  const formatDateString = (d) => {
    return d.toISOString().split('T')[0];
  };

  const startStr = selectedStart ? formatDateString(new Date(selectedStart)) : '';
  const endStr = selectedEnd ? formatDateString(new Date(selectedEnd)) : '';

  return (
    <div style={{width: '260px', userSelect: 'none'}}>
      <div style={{display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:4, textAlign:'center', fontWeight:700, fontSize:11, color:'var(--text-dim)', marginBottom:6}}>
        {weekdays.map(w => <div key={w}>{w}</div>)}
      </div>
      <div style={{display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:4, textAlign:'center', fontSize:11}}>
        {cells.map((cell, idx) => {
          const cellStr = formatDateString(cell.date);
          const isStart = cellStr === startStr;
          const isEnd = cellStr === endStr;
          const inRange = startStr && endStr && cellStr > startStr && cellStr < endStr;
          
          let bg = 'transparent';
          let color = cell.isCurrentMonth ? 'var(--text-dark)' : 'var(--text-dim)';
          let borderRadius = '0';
          
          if (isStart || isEnd) {
            bg = '#3B82F6';
            color = 'white';
            borderRadius = isStart ? '8px 0 0 8px' : '0 8px 8px 0';
            if (isStart && !endStr) borderRadius = '8px';
            if (isStart && isEnd) borderRadius = '8px';
          } else if (inRange) {
            bg = '#DBEAFE';
            color = '#1E40AF';
          }

          return (
            <div
              key={idx}
              onClick={() => onDayClick(cell.date)}
              style={{
                padding: '6px 0',
                background: bg,
                color: color,
                borderRadius: borderRadius,
                fontWeight: cell.isCurrentMonth || isStart || isEnd ? 700 : 400,
                cursor: 'pointer',
                transition: 'all 0.1s'
              }}
            >
              {cell.date.getDate()}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function App(){
  const [page,setPage]=useState('overview');
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const info=INFO[page]||INFO.overview;

  // Global Date Period and Range States
  const [globalPeriod, setGlobalPeriod] = useState('30d');
  const [globalRange, setGlobalRange] = useState({ start: '2026-06-15', end: '2026-07-15' });
  const [dateModal, setDateModal] = useState(false);

  // Temporary selections for the modal
  const [tempPeriod, setTempPeriod] = useState('30d');
  const [tempRange, setTempRange] = useState({ start: '2026-06-15', end: '2026-07-15' });

  // Calendar view state (June 2026 is month 5, July 2026 is month 6)
  const [baseMonth, setBaseMonth] = useState(5);
  const [baseYear, setBaseYear] = useState(2026);

  useEffect(() => {
    const loading = document.getElementById('loading');
    if (loading) {
      loading.style.opacity = '0';
      loading.style.transition = 'opacity 0.4s';
      setTimeout(() => loading.remove(), 400);
    }
  }, []);

  const formatDateLong = (str) => {
    if (!str) return '';
    const d = new Date(str);
    if (isNaN(d.getTime())) return str;
    const day = String(d.getDate()).padStart(2, '0');
    const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    const month = months[d.getMonth()];
    const year = d.getFullYear();
    return `${day} ${month} ${year}`;
  };

  const datePillText = useMemo(() => {
    if (globalPeriod === '7d') return '📅 7 Hari Terakhir';
    if (globalPeriod === '30d') return '📅 30 Hari Terakhir';
    if (globalPeriod === '90d') return '📅 90 Hari Terakhir';
    
    if (globalRange.start && globalRange.end) {
      return `📅 ${formatDateLong(globalRange.start)} - ${formatDateLong(globalRange.end)}`;
    }
    return '📅 Pilih Periode';
  }, [globalPeriod, globalRange]);

  const resolvedPeriod = useMemo(() => {
    if (globalPeriod === '7d' || globalPeriod === '30d' || globalPeriod === '90d') {
      return globalPeriod;
    }
    
    if (!globalRange.start || !globalRange.end) return '30d';
    
    const start = new Date(globalRange.start);
    const end = new Date(globalRange.end);
    const diffTime = Math.abs(end - start);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    
    if (diffDays <= 7) return '7d';
    if (diffDays <= 30) return '30d';
    return '90d';
  }, [globalPeriod, globalRange]);

  const handleDayClick = (date) => {
    const dateStr = date.toISOString().split('T')[0];
    if (!tempRange.start || (tempRange.start && tempRange.end)) {
      setTempRange({ start: dateStr, end: '' });
      setTempPeriod('custom');
    } else {
      if (dateStr < tempRange.start) {
        setTempRange({ start: dateStr, end: '' });
      } else {
        setTempRange(p => ({ ...p, end: dateStr }));
      }
      setTempPeriod('custom');
    }
  };

  const selectPreset = (presetId) => {
    setTempPeriod(presetId);
    const today = new Date();
    let start = new Date();
    let end = new Date();

    switch(presetId) {
      case 'today':
        break;
      case 'yesterday':
        start.setDate(today.getDate() - 1);
        end.setDate(today.getDate() - 1);
        break;
      case '7d':
        start.setDate(today.getDate() - 7);
        break;
      case '30d':
        start.setDate(today.getDate() - 30);
        break;
      case 'this_month':
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        break;
      case 'last_month':
        start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        end = new Date(today.getFullYear(), today.getMonth(), 0);
        break;
      default:
        break;
    }
    
    setTempRange({
      start: start.toISOString().split('T')[0],
      end: end.toISOString().split('T')[0]
    });
  };

  const nextMonth = () => {
    if (baseMonth === 11) {
      setBaseMonth(0);
      setBaseYear(p => p + 1);
    } else {
      setBaseMonth(p => p + 1);
    }
  };

  const prevMonth = () => {
    if (baseMonth === 0) {
      setBaseMonth(11);
      setBaseYear(p => p - 1);
    } else {
      setBaseMonth(p => p - 1);
    }
  };

  const bottomMonth = baseMonth === 11 ? 0 : baseMonth + 1;
  const bottomYear = baseMonth === 11 ? baseYear + 1 : baseYear;

  function renderPage(){
    switch(page){
      case 'overview':  
        return <OverviewPage period={resolvedPeriod} range={globalRange}/>;
      case 'sales_dashboard':   
        return <SalesDashboardPage period={resolvedPeriod} range={globalRange}/>;
      case 'social_media': 
        return <SocialMediaHub period={resolvedPeriod} range={globalRange}/>;
      case 'campaign_content':  
        return <CampaignContentHub period={resolvedPeriod} range={globalRange}/>;
      case 'ads_performance':       
        return <AdsPage period={resolvedPeriod} range={globalRange}/>;
      case 'product_dashboard':   
        return <ProductPage period={resolvedPeriod} range={globalRange}/>;
      case 'customer_journey':   
        return <JourneyPage period={resolvedPeriod} range={globalRange}/>;
      case 'report_export':

      default: {
        const item = NAV.find(n => n.id === page);
        return <PlaceholderPage name={item ? item.label : page} />;
      }
    }
  }

  return(
    <div className="app">
      <Sidebar active={page} onNav={setPage} mobileOpen={mobileMenuOpen} onClose={() => setMobileMenuOpen(false)} />
      <div className="main">
        <header className="topbar">
          <div style={{display:'flex', alignItems:'center', gap:10}}>
            <button 
              className="mobile-toggle"
              style={{
                background:'none',
                border:'none',
                fontSize:22,
                cursor:'pointer',
                color:'var(--text-dark)',
                display:'none',
                outline:'none'
              }}
              onClick={() => setMobileMenuOpen(true)}
            >
              ☰
            </button>

              <div className="page-title">{info.title}</div>
              <div className="page-sub">{info.sub}</div>
            </div>
          </div>
          <div className="topbar-right">
            <button

                background: 'var(--gold-pale)',

                cursor: 'pointer',

                alignItems: 'center',
                gap: '6px',
                transition: 'all 0.2s',
                outline: 'none'
              }}
              onClick={() => {
                setTempPeriod(globalPeriod);

                >
                  {o.label}
                </button>
              ))}
            </div>

            {/* Right calendars */}
            <div style={{flex:1, display:'flex', flexDirection:'column', gap:20, overflowY:'auto', maxHeight:'340px', paddingRight:6}}>
              
              {/* Top Calendar (Base Month) */}
              <div style={{borderBottom:'1px solid var(--bg2)', paddingBottom:14}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', fontWeight:800, fontSize:12, marginBottom:10, textTransform:'uppercase'}}>
                  <span onClick={prevMonth} style={{cursor:'pointer', padding:'2px 8px', background:'var(--bg2)', borderRadius:4}}>❮</span>
                  <span>{new Date(baseYear, baseMonth).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</span>
                  <span style={{visibility:'hidden'}}>❯</span>
                </div>
                <Calendar
                  month={baseMonth}
                  year={baseYear}
                  selectedStart={tempRange.start}
                  selectedEnd={tempRange.end}
                  onDayClick={handleDayClick}
                />
              </div>

              {/* Bottom Calendar (Base Month + 1) */}
              <div>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', fontWeight:800, fontSize:12, marginBottom:10, textTransform:'uppercase'}}>
                  <span style={{visibility:'hidden'}}>❮</span>
                  <span>{new Date(bottomYear, bottomMonth).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</span>
                  <span onClick={nextMonth} style={{cursor:'pointer', padding:'2px 8px', background:'var(--bg2)', borderRadius:4}}>❯</span>
                </div>
                <Calendar
                  month={bottomMonth}
                  year={bottomYear}
                  selectedStart={tempRange.start}
                  selectedEnd={tempRange.end}
                  onDayClick={handleDayClick}
                />
              </div>

            </div>

          </div>

          {/* Bottom control bar */}
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', borderTop:'1px solid var(--bg2)', paddingTop:12, marginTop:12}}>
            <div style={{fontSize:13, fontWeight:700, color:'var(--text-dark)'}}>
              {tempRange.start && tempRange.end ? `${formatDateLong(tempRange.start)} - ${formatDateLong(tempRange.end)}` : ''}
            </div>
            <div style={{display:'flex', gap:10}}>
              <button className="btn btn-ghost" onClick={() => setDateModal(false)} style={{cursor:'pointer', border:'none', background:'transparent', fontSize:13, fontWeight:700}}>Cancel</button>
              <button 
                className="btn" 
                style={{background:'#1E40AF', color:'white', border:'none', padding:'8px 18px', borderRadius:8, fontSize:13, fontWeight:700, cursor:'pointer'}}
                onClick={() => {
                  setGlobalPeriod(tempPeriod);
                  setGlobalRange(tempRange);
                  setDateModal(false);
                }}
              >
                Apply
              </button>
            </div>
          </div>

        </div>
      </Modal>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
