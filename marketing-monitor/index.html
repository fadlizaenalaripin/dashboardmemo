<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momen Marketing Monitor</title>
  <meta name="description" content="Pantau performa marketing Instagram & TikTok Momen Batik secara real-time" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- React 18 (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- Babel (JSX runtime) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading" style="
    position:fixed; inset:0;
    background: #FAFAF8;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:999;
    font-family: 'Plus Jakarta Sans', sans-serif;
  ">
    <img src="asset/logo momen 1x1.png" alt="Momen" style="width:80px; height:80px; object-fit:contain; margin-bottom:20px; animation: spin 2s linear infinite;" />
    <div style="font-size:20px; font-weight:800; color:#1C1811; letter-spacing:3px;">MOMEN</div>
    <div style="font-size:12px; color:#8A7E6A; margin-top:6px;">Marketing Monitor</div>
    <div style="margin-top:24px; display:flex; gap:6px;">
      <div style="width:8px;height:8px;border-radius:50%;background:#C9A84C;animation:bounce 1.2s ease-in-out 0s infinite;"></div>
      <div style="width:8px;height:8px;border-radius:50%;background:#C9A84C;animation:bounce 1.2s ease-in-out 0.2s infinite;"></div>
      <div style="width:8px;height:8px;border-radius:50%;background:#C9A84C;animation:bounce 1.2s ease-in-out 0.4s infinite;"></div>
    </div>
  </div>

  <style>
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes bounce {
      0%,80%,100%{transform:scale(0.8);opacity:0.5}
      40%{transform:scale(1.2);opacity:1}
    }
  </style>

  <!-- React Root -->
  <div id="root"></div>

  <!-- Load JS files in order: data → components → pages → app -->
  <script type="text/babel" src="js/data.js"></script>
  <script type="text/babel" src="js/components.js"></script>
  <script type="text/babel" src="js/pages.js"></script>
  <script type="text/babel" src="js/app.js"></script>

  <!-- Hide loading screen when React is ready -->
  <script>
    window.addEventListener('load', function() {
      // Wait for Babel + React to mount
      setTimeout(function() {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.opacity = '0';
          loading.style.transition = 'opacity 0.4s';
          setTimeout(() => loading.remove(), 400);
        }
      }, 2800);
    });
  </script>
</body>
</html>
